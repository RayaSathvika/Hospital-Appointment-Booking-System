<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="login">
    <header class="topbar">
        <a class="brand" href="index.html"><span class="logo">+</span><div><strong>Hospital Appointment</strong><span>Booking System</span></div></a>
        <nav class="nav" data-nav="public"></nav>
    </header>
    <main class="auth-wrap">
        <form class="auth-card" id="login-form">
            <div class="avatar">👤</div>
            <h1>Login</h1>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />
            <button type="submit">Login</button>
            <p class="switch">New user? <a href="register.html">Register Here</a></p>
            <div id="message" class="message" hidden></div>
        </form>
    </main>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
