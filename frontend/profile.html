<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="profile">
    <div class="shell">
        <aside class="sidebar">
            <a class="brand" href="index.html"><span class="logo">+</span><div><strong>Hospital Appointment</strong><span>Booking</span></div></a>
            <nav class="side-nav" data-nav="patient"></nav>
            <button class="js-logout" type="button">Logout</button>
        </aside>
        <main class="shell-main">
            <h1>My Profile</h1>
            <section class="panel">
                <div class="mini-avatar" id="profile-initials"></div>
                <h2 id="profile-name"></h2>
                <div class="profile-grid">
                    <article><span>Email</span><strong id="profile-email"></strong></article>
                    <article><span>Phone</span><strong id="profile-phone"></strong></article>
                    <article><span>Patient ID</span><strong id="profile-id"></strong></article>
                </div>
            </section>
        </main>
    </div>
    <script src="js/common.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
