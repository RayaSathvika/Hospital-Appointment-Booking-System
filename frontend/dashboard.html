<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="dashboard">
    <div class="shell">
        <aside class="sidebar">
            <a class="brand" href="index.html"><span class="logo">+</span><div><strong>Hospital Appointment</strong><span>Booking</span></div></a>
            <nav class="side-nav" data-nav="patient"></nav>
            <button class="js-logout" type="button">Logout</button>
        </aside>
        <main class="shell-main">
            <h1 id="greeting">Welcome</h1>
            <p class="lede" id="summary">Manage your appointments and health easily.</p>
            <section class="action-grid">
                <a class="action-card" href="book.html"><div class="icon">📅</div><strong>Book Appointment</strong></a>
                <a class="action-card" href="appointments.html"><div class="icon">☰</div><strong>My Appointments</strong></a>
                <a class="action-card" href="profile.html"><div class="icon">👤</div><strong>My Profile</strong></a>
            </section>
            <section class="panel">
                <h2>Upcoming Appointment</h2>
                <div id="upcoming"></div>
            </section>
        </main>
    </div>
    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
